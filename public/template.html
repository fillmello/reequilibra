<!DOCTYPE html>

        <a href="cultura.html" class="d-block text-white fw-bold fs-5 py-1">Cultura</a>
        <a href="tecnologia.html" class="d-block text-white fw-bold fs-5 py-1">Tecnologia</a>

  <main class="container mt-5 pt-5">
    <a id="linkPrincipal" href="detalhes.html?id=1">
      <section class="row row-cols-2 align-items-center my-5 py-5">
        <div class="col-md-6 col-12">
          <img id="imgPrincipal" src="" class="img-fluid rounded mb-5" alt="Imagem da Notícia"/>
        </div>
        <div id="ulnews" class="col-md-6 col-12 noticia-info">
          <p class="text-muted fs-5"></p>
          <h2 class="fw-bold text-dark"></h2>
        </div>
      </section>
    </a>

    <h1 class="ultimas_noticias fw-bold mb-4">Últimas Notícias</h1>
    <section class="row row-cols-1 row-cols-md-4 g-4">
      <a href="detalhes.html?id=1"><article><div id="news1" class="card shadow-lg"><img class="card-img-top" src="" alt=""><div class="card-body"><p class="text-muted"></p><h5 class="card-title fw-bold"></h5></div></div></article></a>
      <a href="detalhes.html?id=2"><article><div id="news2" class="card shadow-lg"><img class="card-img-top" src="" alt=""><div class="card-body"><p class="text-muted"></p><h5 class="card-title fw-bold"></h5></div></div></article></a>
      <a href="detalhes.html?id=3"><article><div id="news3" class="card shadow-lg"><img class="card-img-top" src="" alt=""><div class="card-body"><p class="text-muted"></p><h5 class="card-title fw-bold"></h5></div></div></article></a>
      <a href="detalhes.html?id=4"><article><div id="news4" class="card shadow-lg"><img class="card-img-top" src="" alt=""><div class="card-body"><p class="text-muted"></p><h5 class="card-title fw-bold"></h5></div></div></article></a>
    </section>

  <footer class="bg-secondary text-white text-center py-4 mt-5">
    <p class="mt-3">&copy; 2025 PUC NEWS - Todos os direitos reservados.</p>
  </footer>

  <script src="app.js"></script>
<script>
  function disparo() {
    const todasNoticias = dados;

    const noticiaDestaque = todasNoticias[0]; // ou use um critério, como a mais recente
    const noticiasOutras = todasNoticias.filter(n => n.id !== noticiaDestaque.id);

    // Atualiza a notícia de destaque
    const ulnews = document.getElementById("ulnews");
    const linkPrincipal = document.getElementById("linkPrincipal");
    const imgPrincipal = document.getElementById("imgPrincipal");

    if (ulnews && linkPrincipal && imgPrincipal) {
      ulnews.querySelector("p").textContent = noticiaDestaque.tempo;
      ulnews.querySelector("h2").textContent = noticiaDestaque.titulo;
      imgPrincipal.src = noticiaDestaque.imagem;
      imgPrincipal.alt = noticiaDestaque.titulo;
      linkPrincipal.href = `detalhes.html?id=${noticiaDestaque.id}`;
    }

    // Atualiza os cards com as demais notícias
    noticiasOutras.slice(0, 4).forEach((noticia, index) => {
      const id = `news${index + 1}`;
      const card = document.getElementById(id);
      if (card) {
        const tempo = card.querySelector("p");
        const titulo = card.querySelector("h5");
        const img = card.querySelector("img");
        const link = card.closest("a");

        if (tempo && titulo && img && link) {
          tempo.textContent = noticia.tempo;
          titulo.textContent = noticia.titulo;
          img.src = noticia.imagem;
          img.alt = noticia.titulo;
          link.href = `detalhes.html?id=${noticia.id}`;
        }
      }
    });
  }

  window.onload = disparo;
</script>

</body>
</html>
